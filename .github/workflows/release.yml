  name: Release

  on:
    push:
      tags:
        - 'v*.*.*'

  permissions:
    contents: write

  jobs:
    build-windows:
      name: Build Windows
      runs-on: windows-latest

      steps:

        - name: Checkout
          uses: actions/checkout@v4

        - name: Install Rust
          uses: dtolnay/rust-toolchain@stable
          with:
            toolchain: stable
            targets: x86_64-pc-windows-msvc

        - name: Get package name
          id: package
          shell: pwsh
          run: |
            $name = cargo metadata --no-deps --format-version 1 |
              ConvertFrom-Json |
              Select-Object -ExpandProperty packages |
              Select-Object -First 1 -ExpandProperty name
            
            if ([string]::IsNullOrWhiteSpace($name)) {
              throw "Failed to get package name from Cargo.toml"
            }
            
            "name=$name" >> $env:GITHUB_OUTPUT
            
            Write-Host "Package name: $name"

        - name: Build
          run: cargo build --release -vv --target x86_64-pc-windows-msvc

        - name: Package
          shell: pwsh
          run: |
            $version = "${{ github.ref_name }}"
            $name = "${{ steps.package.outputs.name }}"
            $dirName = "$name-$version-windows-x64"
            
            New-Item -ItemType Directory -Force -Path "dist/$dirName"
            
            Copy-Item `
              "target/x86_64-pc-windows-msvc/release/$name.exe" `
              "dist/$dirName/"
            
            Compress-Archive `
              -Path "dist/$dirName/*" `
              -DestinationPath "dist/$dirName.zip"

        - name: Create GitHub Release
          uses: softprops/action-gh-release@v2
          with:
            generate_release_notes: true
            files: |
              dist/*.zip
