[package]
name = "ime-alt"
version = "0.2.0"
edition = "2024"
description = "Left/right Alt for IME on/off"
authors = ["Naotsugu Kobayashi <naotsugukobayashi@gmail.com>"]
homepage = "https://github.com/naotsugu/ime-alt"
documentation = "https://github.com/naotsugu/ime-alt"
repository = "https://github.com/naotsugu/ime-alt"
license = "Apache-2.0"

[dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_LibraryLoader",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_SystemServices",
    "Win32_UI_Shell", # Shell_NotifyIconW
    "Win32_Graphics_Gdi", # WNDCLASSW RegisterClassW ...
    "Win32_System_Registry",
    "Win32_System_Threading",
] }

[target.'cfg(windows)'.build-dependencies]
winres = "0.1.12"

[profile.release]
strip = "debuginfo"
panic = "abort"
codegen-units = 1
